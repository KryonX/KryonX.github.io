<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bartosz – Gym Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --bg2: #16181c;
      --bg3: #1e2026;
      --border: #2a2d35;
      --text: #f0f0ee;
      --muted: #7a7d88;
      --accent: #e8ff3a;
      --accent2: #3affd0;
      --done-bg: #0f2e25;
      --done-border: #1a5c43;
      --done-glow: 0 0 18px #3affd066, 0 0 40px #3affd022;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .date-badge {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .day-nav {
      display: flex;
      gap: 0.4rem;
      padding: 1.5rem 2rem 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-nav::-webkit-scrollbar { display: none; }

    .day-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .day-btn:hover { border-color: #555; color: var(--text); }
    .day-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e0f11;
    }
    .day-btn.rest { opacity: 0.4; }

    .rest-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 1rem;
      color: var(--muted);
    }
    .rest-view .rest-icon { font-size: 4rem; }
    .rest-view h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
    }

    .day-header {
      padding: 2rem 2rem 1rem;
    }
    .focus-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .focus-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--text);
    }
    .muscles-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .muscle-tag {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
    }

    .progress-bar-wrap {
      padding: 0 2rem;
      margin-bottom: 0.5rem;
    }
    .progress-bar-track {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .progress-text {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.4rem;
      font-weight: 500;
    }

    .exercises {
      padding: 1rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .exercise-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.4s, background 0.4s, box-shadow 0.4s;
    }
    .exercise-card.completed {
      background: var(--done-bg);
      border-color: var(--done-border);
      box-shadow: var(--done-glow);
    }

    .exercise-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      gap: 1rem;
    }
    .exercise-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex: 1;
    }
    .exercise-card.completed .exercise-name {
      color: var(--accent2);
    }
    .done-badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--done-border);
      color: var(--accent2);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    .exercise-card.completed .done-badge { opacity: 1; }

    .exercise-meta {
      display: flex;
      gap: 1rem;
      padding: 0 1.25rem 0.75rem;
    }
    .meta-item {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meta-item span {
      color: var(--text);
      font-weight: 600;
    }

    .sets-row {
      display: flex;
      gap: 0.6rem;
      padding: 0.75rem 1.25rem 1.1rem;
      flex-wrap: wrap;
    }

    .set-btn {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg3);
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .set-btn:hover { border-color: #555; color: var(--text); }
    .set-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e0f11;
    }
    .set-btn.done::after {
      content: '✓';
      position: absolute;
      font-size: 0.7rem;
      bottom: 4px;
      right: 5px;
      color: #0e0f11;
      font-weight: 900;
    }

    .notes-section {
      margin: 1rem 2rem 2rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .notes-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .note-item {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .note-item strong {
      display: block;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.15rem;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .reset-btn {
      display: block;
      margin: 0 2rem 2rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .reset-btn:hover { color: var(--text); border-color: #555; }

    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      .day-nav { padding: 1rem 1.25rem 0; }
      .day-header { padding: 1.5rem 1.25rem 0.75rem; }
      .focus-title { font-size: 2.2rem; }
      .exercises { padding: 1rem 1.25rem 3rem; }
      .progress-bar-wrap { padding: 0 1.25rem; }
      .notes-section, .reset-btn { margin-left: 1.25rem; margin-right: 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">💪 Gym Plan</div>
  <div class="date-badge" id="header-date"></div>
</header>

<nav class="day-nav" id="day-nav"></nav>

<main id="main-content"></main>

<script>
const PLAN = {
  Monday: {
    focus: "Push",
    muscles: ["Chest", "Shoulders", "Triceps"],
    exercises: [
      { name: "Bench Press", sets: 4, reps: "8-10" },
      { name: "Incline Dumbbell Press", sets: 4, reps: "8-10" },
      { name: "Shoulder Press", sets: 4, reps: "8-10" },
      { name: "Lateral Raises", sets: 4, reps: "8-10" },
      { name: "Tricep Pushdown", sets: 4, reps: "8-10" }
    ]
  },
  Tuesday: {
    focus: "Pull",
    muscles: ["Back", "Biceps"],
    exercises: [
      { name: "Pull-Ups / Lat Pulldown", sets: 4, reps: "8-10" },
      { name: "Barbell Rows", sets: 4, reps: "8-10" },
      { name: "Cable Rows", sets: 4, reps: "8-10" },
      { name: "Face Pulls", sets: 4, reps: "8-10" },
      { name: "Barbell / Hammer Curl", sets: 4, reps: "8-10" }
    ]
  },
  Wednesday: {
    focus: "Legs",
    muscles: ["Quads", "Hamstrings", "Calves", "Abs"],
    exercises: [
      { name: "Squat / Hack Squat", sets: 4, reps: "8-10" },
      { name: "Romanian Deadlift", sets: 4, reps: "8-10" },
      { name: "Leg Curl", sets: 4, reps: "8-10" },
      { name: "Calf Raises", sets: 4, reps: "8-10" },
      { name: "Abs Exercise", sets: 4, reps: "8-10" }
    ]
  },
  Thursday: {
    focus: "Upper Body",
    muscles: ["Chest", "Back", "Arms", "Shoulders"],
    exercises: [
      { name: "Incline Dumbbell Press", sets: 4, reps: "8-10" },
      { name: "Lat Pulldown", sets: 4, reps: "8-10" },
      { name: "Dumbbell Row", sets: 4, reps: "8-10" },
      { name: "Lateral Raises", sets: 4, reps: "8-10" },
      { name: "Preacher Curl", sets: 4, reps: "8-10" },
      { name: "Tricep Extension", sets: 4, reps: "8-10" }
    ]
  },
  Friday: {
    focus: "Arms & Delts",
    muscles: ["Biceps", "Triceps", "Shoulders"],
    exercises: [
      { name: "Shoulder Press", sets: 4, reps: "8-10" },
      { name: "Lateral Raises", sets: 4, reps: "8-10" },
      { name: "Face Pulls", sets: 4, reps: "8-10" },
      { name: "Barbell Curl", sets: 4, reps: "8-10" },
      { name: "Hammer Curl", sets: 4, reps: "8-10" },
      { name: "Tricep Pushdown", sets: 4, reps: "8-10" }
    ]
  },
  Saturday: null,
  Sunday: null
};

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const JS_DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function getToday() {
  return JS_DAYS[new Date().getDay()];
}

function storageKey(day, exIdx, setIdx) {
  return `gym_${day}_ex${exIdx}_set${setIdx}`;
}

function isSetDone(day, exIdx, setIdx) {
  return localStorage.getItem(storageKey(day, exIdx, setIdx)) === '1';
}

function toggleSet(day, exIdx, setIdx) {
  const key = storageKey(day, exIdx, setIdx);
  if (localStorage.getItem(key) === '1') {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, '1');
  }
}

function resetDay(day) {
  const plan = PLAN[day];
  if (!plan) return;
  plan.exercises.forEach((ex, ei) => {
    for (let s = 0; s < ex.sets; s++) {
      localStorage.removeItem(storageKey(day, ei, s));
    }
  });
}

let activeDay = getToday();

function renderNav() {
  const nav = document.getElementById('day-nav');
  nav.innerHTML = '';
  DAYS.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (PLAN[day] === null ? ' rest' : '') + (day === activeDay ? ' active' : '');
    btn.textContent = day.slice(0, 3);
    btn.title = day;
    btn.addEventListener('click', () => { activeDay = day; render(); });
    nav.appendChild(btn);
  });
}

function calcProgress(day) {
  const plan = PLAN[day];
  if (!plan) return { done: 0, total: 0 };
  let done = 0, total = 0;
  plan.exercises.forEach((ex, ei) => {
    for (let s = 0; s < ex.sets; s++) {
      total++;
      if (isSetDone(day, ei, s)) done++;
    }
  });
  return { done, total };
}

function renderDay(day) {
  const plan = PLAN[day];
  const main = document.getElementById('main-content');

  if (!plan) {
    main.innerHTML = `
      <div class="rest-view">
        <div class="rest-icon">🛌</div>
        <h2>Rustdag</h2>
        <p style="color:var(--muted);font-size:0.95rem;">Herstel is net zo belangrijk als trainen.</p>
      </div>`;
    return;
  }

  const { done, total } = calcProgress(day);
  const pct = total ? Math.round((done / total) * 100) : 0;

  let exHTML = '';
  plan.exercises.forEach((ex, ei) => {
    const doneSets = Array.from({ length: ex.sets }, (_, s) => isSetDone(day, ei, s));
    const allDone = doneSets.every(Boolean);

    let setsHTML = '';
    for (let s = 0; s < ex.sets; s++) {
      setsHTML += `<button class="set-btn${doneSets[s] ? ' done' : ''}" data-ex="${ei}" data-set="${s}">
        ${s + 1}
      </button>`;
    }

    exHTML += `
      <div class="exercise-card${allDone ? ' completed' : ''}" id="ex-card-${ei}">
        <div class="exercise-head">
          <div class="exercise-name">${ex.name}</div>
          <div class="done-badge">✓ Done</div>
        </div>
        <div class="exercise-meta">
          <div class="meta-item">Sets: <span>${ex.sets}</span></div>
          <div class="meta-item">Reps: <span>${ex.reps}</span></div>
          <div class="meta-item">Voltooid: <span>${doneSets.filter(Boolean).length}/${ex.sets}</span></div>
        </div>
        <div class="sets-row">${setsHTML}</div>
      </div>`;
  });

  main.innerHTML = `
    <div class="day-header">
      <div class="focus-label">Vandaag — ${day}</div>
      <div class="focus-title">${plan.focus}</div>
      <div class="muscles-row">${plan.muscles.map(m => `<span class="muscle-tag">${m}</span>`).join('')}</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${done} / ${total} sets voltooid — ${pct}%</div>
    </div>
    <div class="exercises">${exHTML}</div>
    <div class="notes-section">
      <div class="notes-title">📋 Tips</div>
      <div class="notes-grid">
        <div class="note-item"><strong>Progressive overload</strong>Verhoog gewicht of reps per week.</div>
        <div class="note-item"><strong>Rust – compounds</strong>2–3 minuten</div>
        <div class="note-item"><strong>Rust – isolatie</strong>60–90 seconden</div>
        <div class="note-item"><strong>Sessieduur</strong>60–90 minuten</div>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn">↺ Reset dag</button>`;

  document.querySelectorAll('.set-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ei = +btn.dataset.ex;
      const si = +btn.dataset.set;
      toggleSet(day, ei, si);
      renderDay(day);
    });
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (confirm(`Reset alle sets voor ${day}?`)) {
      resetDay(day);
      renderDay(day);
    }
  });
}

function setHeaderDate() {
  const now = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('header-date').textContent = now.toLocaleDateString('nl-NL', opts);
}

function render() {
  renderNav();
  renderDay(activeDay);
}

setHeaderDate();
render();
</script>
</body>
</html>

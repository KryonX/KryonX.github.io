<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Photo Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; }
  #topbar h1 { font-size: 15px; font-weight: 600; color: #fff; margin-right: 8px; }
  .tbtn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; font-size: 13px; border: 1px solid #333; border-radius: 6px; background: #222; color: #ccc; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .tbtn:hover { background: #2d2d2d; color: #fff; }
  .tbtn.active { background: #1d3a5f; border-color: #2d6aad; color: #7eb8f7; }
  #main { display: flex; flex: 1; min-height: 0; }
  #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #141414; position: relative; overflow: hidden; min-height: 400px; }
  #upload-zone { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #555; cursor: pointer; padding: 60px 40px; text-align: center; border: 2px dashed #2a2a2a; border-radius: 12px; transition: border-color 0.2s; }
  #upload-zone:hover { border-color: #444; color: #888; }
  #upload-zone i { font-size: 48px; }
  #upload-zone p { font-size: 15px; }
  #upload-zone small { font-size: 12px; color: #444; }
  #main-canvas { max-width: 100%; max-height: calc(100vh - 120px); display: none; border-radius: 6px; }
  #sidebar { width: 240px; background: #181818; border-left: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow-y: auto; }
  .panel { padding: 14px; border-bottom: 1px solid #222; }
  .panel-title { font-size: 11px; font-weight: 600; color: #555; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .adj-row { margin-bottom: 10px; }
  .adj-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 4px; }
  .adj-label span { color: #ccc; font-weight: 500; }
  input[type=range] { width: 100%; accent-color: #4a90d9; cursor: pointer; }
  .preset-grid { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset { padding: 5px 9px; font-size: 11px; border: 1px solid #2a2a2a; border-radius: 5px; background: #222; color: #888; cursor: pointer; transition: all 0.15s; }
  .preset:hover { background: #2a2a2a; color: #ccc; border-color: #444; }
  #ai-prompt { width: 100%; font-size: 13px; padding: 8px 10px; border: 1px solid #2a2a2a; border-radius: 6px; background: #111; color: #ddd; resize: none; height: 64px; font-family: inherit; margin-bottom: 8px; outline: none; }
  #ai-prompt:focus { border-color: #4a90d9; }
  #ai-go { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #2d6aad; border-radius: 6px; background: #1a3a5e; color: #7eb8f7; cursor: pointer; font-weight: 500; transition: background 0.15s; }
  #ai-go:hover { background: #1d4a78; }
  #ai-go:disabled { opacity: 0.5; cursor: not-allowed; }
  #ai-result { margin-top: 10px; font-size: 12px; color: #888; background: #111; border-radius: 6px; padding: 10px; display: none; line-height: 1.6; border: 1px solid #222; }
  #statusbar { padding: 5px 14px; font-size: 11px; color: #444; background: #111; border-top: 1px solid #1e1e1e; }
  #file-input { display: none; }
</style>
</head>
<body>
<input type="file" id="file-input" accept="image/*">

<div id="topbar">
  <h1><i class="ti ti-wand"></i> AI Photo Editor</h1>
  <button class="tbtn" onclick="document.getElementById('file-input').click()"><i class="ti ti-upload"></i> Open</button>
  <button class="tbtn" onclick="resetAll()"><i class="ti ti-refresh"></i> Reset</button>
  <button class="tbtn" onclick="downloadImg()"><i class="ti ti-download"></i> Save PNG</button>
  <button class="tbtn" id="btn-grayscale" onclick="toggleF('grayscale')"><i class="ti ti-photo"></i> Grayscale</button>
  <button class="tbtn" id="btn-sepia" onclick="toggleF('sepia')"><i class="ti ti-sun"></i> Sepia</button>
  <button class="tbtn" id="btn-invert" onclick="toggleF('invert')"><i class="ti ti-color-filter"></i> Invert</button>
</div>

<div id="main">
  <div id="canvas-wrap">
    <div id="upload-zone" onclick="document.getElementById('file-input').click()">
      <i class="ti ti-photo"></i>
      <p>Click to open an image</p>
      <small>JPG · PNG · WebP supported</small>
    </div>
    <canvas id="main-canvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="panel">
      <div class="panel-title">Presets</div>
      <div class="preset-grid">
        <span class="preset" onclick="applyPreset('vivid')">Vivid</span>
        <span class="preset" onclick="applyPreset('matte')">Matte</span>
        <span class="preset" onclick="applyPreset('cool')">Cool</span>
        <span class="preset" onclick="applyPreset('warm')">Warm</span>
        <span class="preset" onclick="applyPreset('dramatic')">Dramatic</span>
        <span class="preset" onclick="applyPreset('fade')">Fade</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Adjustments</div>
      <div class="adj-row">
        <div class="adj-label">Brightness <span id="v-brightness">0</span></div>
        <input type="range" min="-100" max="100" value="0" step="1" id="s-brightness" oninput="syncAdj('brightness')">
      </div>
      <div class="adj-row">
        <div class="adj-label">Contrast <span id="v-contrast">0</span></div>
        <input type="range" min="-100" max="100" value="0" step="1" id="s-contrast" oninput="syncAdj('contrast')">
      </div>
      <div class="adj-row">
        <div class="adj-label">Saturation <span id="v-saturation">0</span></div>
        <input type="range" min="-100" max="100" value="0" step="1" id="s-saturation" oninput="syncAdj('saturation')">
      </div>
      <div class="adj-row">
        <div class="adj-label">Blur <span id="v-blur">0</span>px</div>
        <input type="range" min="0" max="20" value="0" step="1" id="s-blur" oninput="syncAdj('blur')">
      </div>
      <div class="adj-row">
        <div class="adj-label">Hue <span id="v-hue">0</span>°</div>
        <input type="range" min="0" max="360" value="0" step="1" id="s-hue" oninput="syncAdj('hue')">
      </div>
      <div class="adj-row">
        <div class="adj-label">Opacity <span id="v-opacity">100</span>%</div>
        <input type="range" min="10" max="100" value="100" step="1" id="s-opacity" oninput="syncAdj('opacity')">
      </div>
    </div>

    <div class="panel" style="flex:1">
      <div class="panel-title"><i class="ti ti-sparkles"></i> Ask AI</div>
      <div class="preset-grid" style="margin-bottom:10px">
        <span class="preset" onclick="setP('Golden hour warm glow')">Golden hour</span>
        <span class="preset" onclick="setP('Cinematic moody dark')">Cinematic</span>
        <span class="preset" onclick="setP('Bright and airy')">Airy</span>
        <span class="preset" onclick="setP('Dramatic black and white')">B&W</span>
      </div>
      <textarea id="ai-prompt" placeholder="Describe an edit… e.g. 'warmer with more contrast'"></textarea>
      <button id="ai-go" onclick="runAI()"><i class="ti ti-send"></i> Apply with AI</button>
      <div id="ai-result"></div>
    </div>
  </div>
</div>

<div id="statusbar">No image loaded — click Open to start</div>

<script>
  // !! PASTE YOUR CLOUDFLARE WORKER URL HERE !!
  const WORKER_URL = 'https://photo-edit-assistant.stoplukasz61-044.workers.dev';

  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  let img = null;
  let filt = { grayscale: false, sepia: false, invert: false };
  let adj = { brightness: 0, contrast: 0, saturation: 0, blur: 0, hue: 0, opacity: 100 };

  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        document.getElementById('upload-zone').style.display = 'none';
        canvas.style.display = 'block';
        setStatus(img.width + ' × ' + img.height + 'px  ·  ' + file.name);
        applyFilters();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function applyFilters() {
    if (!img) return;
    const b = 1 + adj.brightness / 100;
    const c = 1 + adj.contrast / 100;
    const s = 1 + adj.saturation / 100;
    let f = `brightness(${b}) contrast(${c}) saturate(${s}) blur(${adj.blur}px) hue-rotate(${adj.hue}deg) opacity(${adj.opacity}%)`;
    if (filt.grayscale) f += ' grayscale(1)';
    if (filt.sepia) f += ' sepia(1)';
    if (filt.invert) f += ' invert(1)';
    canvas.style.filter = f;
  }

  function syncAdj(k) {
    adj[k] = Number(document.getElementById('s-' + k).value);
    document.getElementById('v-' + k).textContent = adj[k];
    applyFilters();
  }

  function setSlider(k, v) {
    adj[k] = v;
    document.getElementById('s-' + k).value = v;
    document.getElementById('v-' + k).textContent = v;
  }

  function toggleF(name) {
    filt[name] = !filt[name];
    document.getElementById('btn-' + name).classList.toggle('active', filt[name]);
    applyFilters();
  }

  function resetAll() {
    adj = { brightness: 0, contrast: 0, saturation: 0, blur: 0, hue: 0, opacity: 100 };
    filt = { grayscale: false, sepia: false, invert: false };
    ['brightness','contrast','saturation','blur','hue'].forEach(k => setSlider(k, 0));
    setSlider('opacity', 100);
    ['grayscale','sepia','invert'].forEach(f => document.getElementById('btn-' + f).classList.remove('active'));
    applyFilters();
  }

  function applyPreset(name) {
    const p = {
      vivid:    { brightness: 10,  contrast: 20,  saturation: 50,  blur: 0, hue: 0,   opacity: 100 },
      matte:    { brightness: 5,   contrast: -10, saturation: -20, blur: 0, hue: 0,   opacity: 100 },
      cool:     { brightness: 0,   contrast: 10,  saturation: 10,  blur: 0, hue: 200, opacity: 100 },
      warm:     { brightness: 5,   contrast: 10,  saturation: 20,  blur: 0, hue: 30,  opacity: 100 },
      dramatic: { brightness: -10, contrast: 50,  saturation: 30,  blur: 0, hue: 0,   opacity: 100 },
      fade:     { brightness: 15,  contrast: -20, saturation: -30, blur: 0, hue: 0,   opacity: 90  },
    };
    Object.entries(p[name]).forEach(([k, v]) => setSlider(k, v));
    applyFilters();
  }

  function setP(t) { document.getElementById('ai-prompt').value = t; }
  function setStatus(msg) { document.getElementById('statusbar').textContent = msg; }

  function downloadImg() {
    if (!img) { setStatus('Open an image first'); return; }
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const oc = off.getContext('2d');
    oc.filter = canvas.style.filter;
    oc.drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.download = 'edited.png';
    a.href = off.toDataURL('image/png');
    a.click();
  }

  async function runAI() {
    const prompt = document.getElementById('ai-prompt').value.trim();
    const resultEl = document.getElementById('ai-result');
    const btn = document.getElementById('ai-go');
    if (!prompt) return;

    btn.disabled = true;
    btn.textContent = 'Thinking…';
    resultEl.style.display = 'block';
    resultEl.textContent = '…';

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      if (!res.ok) throw new Error('Worker error ' + res.status);

      const data = await res.json();
      const text = data.content?.find(b => b.type === 'text')?.text || '';
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      ['brightness','contrast','saturation','blur','hue','opacity'].forEach(k => {
        if (parsed[k] !== undefined) setSlider(k, parsed[k]);
      });
      ['grayscale','sepia','invert'].forEach(f => {
        if (parsed[f] !== undefined) {
          filt[f] = parsed[f];
          document.getElementById('btn-' + f).classList.toggle('active', parsed[f]);
        }
      });
      applyFilters();
      resultEl.textContent = '✓ ' + (parsed.note || 'Applied!');
      setStatus('AI edits applied');

    } catch (err) {
      resultEl.textContent = '✗ ' + err.message;
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> Apply with AI';
  }
</script>
</body>
</html>

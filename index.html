<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Anything</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #71717a;
      --accent: #a78bfa;
      --glow: rgba(167, 139, 250, 0.15);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* Floating tags layer */
    #floatLayer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .topic-tag {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.875rem;
      text-decoration: none;
      pointer-events: all;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      will-change: transform;
    }

    .topic-tag:hover {
      border-color: var(--accent);
      background: rgba(167,139,250,0.12);
      color: var(--accent);
    }

    .topic-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* Center UI */
    .page {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      pointer-events: none;
    }

    .page > * { pointer-events: all; }

    /* Brain */
    .brain-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brain-wrap::after {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--glow);
      filter: blur(40px);
      z-index: -1;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%       { transform: scale(1.15); opacity: 1; }
    }

    .brain-svg {
      width: 100px;
      height: 100px;
      filter: drop-shadow(0 0 18px rgba(167,139,250,0.5));
      animation: floatBrain 4s ease-in-out infinite;
    }

    @keyframes floatBrain {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* Headline */
    .headline { text-align: center; }

    .headline h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .headline h1 span {
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .headline p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 300;
    }

    /* Search */
    .search-wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 1rem 3.2rem 1rem 1.3rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.12);
    }

    .search-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 1.2rem;
      left: 0; right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- Floating tags -->
<div id="floatLayer"></div>

<!-- Center content -->
<div class="page">

  <div class="brain-wrap">
    <svg class="brain-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 20 C38 20 28 27 24 37 C20 47 22 58 28 65 C32 70 36 73 38 78 C39 81 40 84 42 86 L50 86 L50 20Z"
            fill="url(#grad1)" opacity="0.9"/>
      <path d="M50 20 C62 20 72 27 76 37 C80 47 78 58 72 65 C68 70 64 73 62 78 C61 81 60 84 58 86 L50 86 L50 20Z"
            fill="url(#grad2)" opacity="0.9"/>
      <line x1="50" y1="20" x2="50" y2="86" stroke="#0e0e10" stroke-width="2"/>
      <path d="M32 38 Q38 36 44 40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M28 50 Q36 47 43 52" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M30 62 Q37 59 43 63" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M68 38 Q62 36 56 40" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M72 50 Q64 47 57 52" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M70 62 Q63 59 57 63" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <rect x="44" y="85" width="12" height="5" rx="2" fill="url(#grad1)" opacity="0.7"/>
      <defs>
        <linearGradient id="grad1" x1="50" y1="20" x2="24" y2="86" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <linearGradient id="grad2" x1="50" y1="20" x2="76" y2="86" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#6d28d9"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="headline">
    <h1>Learn <span>Anything</span></h1>
    <p>Click a floating topic — or search below.</p>
  </div>

  <div class="search-wrap">
    <input
      class="search-input"
      id="searchInput"
      type="text"
      placeholder="Search a topic..."
      autocomplete="off"
      spellcheck="false"
    />
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
  </div>

</div>

<footer>
  Add a file to <code>learn/</code> and it appears here automatically
</footer>

<script>
  const layer       = document.getElementById('floatLayer');
  const searchInput = document.getElementById('searchInput');

  let allTopics  = [];
  let particles  = [];
  let rafId      = null;

  // ── Load topics ──────────────────────────────────────────────────
  async function loadTopics() {
    try {
      const res = await fetch('topics.json');
      allTopics = await res.json();
      spawnAll(allTopics);
      animate();
    } catch (e) {
      console.warn('Could not load topics.json', e);
    }
  }

  // ── Spawn a floating tag ─────────────────────────────────────────
  function spawnTag(topic) {
    const a = document.createElement('a');
    a.className = 'topic-tag';
    a.href = `learn/${topic.file}`;
    a.innerHTML = `<span class="dot"></span>${topic.name}`;

    // Random start position (keep away from center a bit)
    const x = Math.random() * (window.innerWidth  - 160);
    const y = Math.random() * (window.innerHeight - 60);

    // Random slow velocity  (px per frame at 60fps → ~0.2–0.6 px/frame)
    const speed = 0.25 + Math.random() * 0.35;
    const angle = Math.random() * Math.PI * 2;

    const p = {
      el: a,
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      w: 0, h: 0   // measured after mount
    };

    a.style.left = x + 'px';
    a.style.top  = y + 'px';
    layer.appendChild(a);

    // Measure after paint
    requestAnimationFrame(() => {
      p.w = a.offsetWidth;
      p.h = a.offsetHeight;
    });

    return p;
  }

  function spawnAll(topics) {
    layer.innerHTML = '';
    particles = [];
    topics.forEach(t => particles.push(spawnTag(t)));
  }

  // ── Animation loop ───────────────────────────────────────────────
  function animate() {
    const W = window.innerWidth;
    const H = window.innerHeight;

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      // Bounce off edges
      if (p.x <= 0)       { p.x = 0;        p.vx = Math.abs(p.vx); }
      if (p.x + p.w >= W) { p.x = W - p.w;  p.vx = -Math.abs(p.vx); }
      if (p.y <= 0)       { p.y = 0;        p.vy = Math.abs(p.vy); }
      if (p.y + p.h >= H) { p.y = H - p.h;  p.vy = -Math.abs(p.vy); }

      p.el.style.left = p.x + 'px';
      p.el.style.top  = p.y + 'px';
    });

    rafId = requestAnimationFrame(animate);
  }

  // ── Search: filter visible tags ──────────────────────────────────
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    particles.forEach(p => {
      const name = p.el.textContent.trim().toLowerCase();
      p.el.style.opacity = (!q || name.includes(q)) ? '1' : '0.12';
    });
  });

  loadTopics();
</script>
</body>
</html>
